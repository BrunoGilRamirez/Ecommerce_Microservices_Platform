# Additional Kafka configuration for development
# This file can be used to customize specific settings

# ==============================================================================
# PRODUCER CONFIGURATION FOR MICROSERVICES
# ==============================================================================

# Recommended configuration for producers in microservices
producer.bootstrap.servers=localhost:9092
producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
producer.value.serializer=org.springframework.kafka.support.serializer.JsonSerializer
producer.acks=all
producer.retries=3
producer.enable.idempotence=true
producer.max.in.flight.requests.per.connection=5
producer.batch.size=16384
producer.linger.ms=5
producer.buffer.memory=33554432
producer.compression.type=lz4

# ==============================================================================
# CONSUMER CONFIGURATION FOR MICROSERVICES
# ==============================================================================

# Recommended configuration for consumers in microservices
consumer.bootstrap.servers=localhost:9092
consumer.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
consumer.value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
consumer.auto.offset.reset=earliest
consumer.enable.auto.commit=false
consumer.session.timeout.ms=30000
consumer.heartbeat.interval.ms=10000
consumer.max.poll.records=500
consumer.max.poll.interval.ms=300000
consumer.fetch.min.bytes=1024
consumer.fetch.max.wait.ms=500

# ==============================================================================
# SPECIFIC TOPIC CONFIGURATION
# ==============================================================================

# Product Events Topic
topic.product-events.partitions=3
topic.product-events.replication.factor=1
topic.product-events.retention.ms=604800000
topic.product-events.compression.type=lz4
topic.product-events.min.insync.replicas=1

# User Events Topic
topic.user-events.partitions=3
topic.user-events.replication.factor=1
topic.user-events.retention.ms=604800000
topic.user-events.compression.type=lz4
topic.user-events.min.insync.replicas=1

# Order Events Topic
topic.order-events.partitions=3
topic.order-events.replication.factor=1
topic.order-events.retention.ms=2592000000
topic.order-events.compression.type=lz4
topic.order-events.min.insync.replicas=1

# Simple Topics (for basic operations)
topic.product.partitions=3
topic.product.replication.factor=1
topic.product.retention.ms=86400000

topic.user.partitions=3
topic.user.replication.factor=1
topic.user.retention.ms=86400000

topic.order.partitions=3
topic.order.replication.factor=1
topic.order.retention.ms=86400000

# ==============================================================================
# SPRING KAFKA CONFIGURATION FOR MICROSERVICES
# ==============================================================================

# Configuration for Spring Boot application.properties
spring.kafka.bootstrap-servers=localhost:9092

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Consumer configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Listener configuration
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# ==============================================================================
# CONSUMER GROUP CONFIGURATION
# ==============================================================================

# Auth Service
auth-service.consumer.group-id=auth-service-group

# User Service
user-service.consumer.group-id=user-service-group
user-service.producer.topic=user-events

# Product Service
product-service.consumer.group-id=product-service-group
product-service.producer.topic=product-events

# Order Service
order-service.consumer.group-id=order-service-group
order-service.producer.topic=order-events
order-service.consumer.topics=product-events,user-events

# Gateway Service (if it needs to consume events)
gateway-service.consumer.group-id=gateway-service-group

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================
# Log settings to identify Kafka events
kafka.log.prefix=KAFKA:
kafka.log.level=INFO

# Microservice-specific log settings
auth-service.kafka.log.level=DEBUG
user-service.kafka.log.level=INFO
product-service.kafka.log.level=INFO
order-service.kafka.log.level=INFO

# ==============================================================================
# HEALTH CHECKS CONFIGURATION
# ==============================================================================
# Kafka health check settings
kafka.health.check.enabled=true
kafka.health.check.timeout=5000
kafka.health.check.topic=__consumer_offsets

# ==============================================================================
# METRICS CONFIGURATION
# ==============================================================================
# Metrics configuration for monitoring
kafka.metrics.enabled=true
kafka.metrics.export.interval=30s
kafka.metrics.include.topics=product-events,user-events,order-events

# ==============================================================================
# LOCAL DEVELOPMENT CONFIGURATION
# ==============================================================================
# Development-specific settings
dev.kafka.auto.create.topics=true
dev.kafka.delete.topics.enable=true
dev.kafka.log.level=DEBUG
dev.kafka.consumer.poll.timeout=1000

# Useful URLs for development
dev.kafka.ui.url=http://localhost:9090
dev.kafka.bootstrap.servers=localhost:9092
dev.zookeeper.url=localhost:2181

# ==============================================================================
# EXAMPLES OF USEFUL COMMANDS
# ==============================================================================
# Commands to manually create topics
# docker exec fp-kafka kafka-topics --bootstrap-server localhost:9092 --create --topic product-events --partitions 3 --replication-factor 1

# Commands to verify topics
# docker exec fp-kafka kafka-topics --bootstrap-server localhost:9092 --list

# Commands to consume test messages
# docker exec fp-kafka kafka-console-consumer --bootstrap-server localhost:9092 --topic product-events --from-beginning

# Commands to produce test messages
# docker exec -it fp-kafka kafka-console-producer --bootstrap-server localhost:9092 --topic product-events
# Comandos para consumir mensajes de test
# docker exec fp-kafka kafka-console-consumer --bootstrap-server localhost:9092 --topic product-events --from-beginning

# Comandos para producir mensajes de test
# docker exec -it fp-kafka kafka-console-producer --bootstrap-server localhost:9092 --topic product-events
