services:
  # ============================================================
  # Infrastructure
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fp-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fp-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    depends_on:
      - zookeeper
    networks:
      - ecommerce-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fp-kafka-ui
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - ecommerce-network

  mysql:
    image: mysql:8.0
    container_name: fp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-network

  # ============================================================
  # Java Services (host network: se ven entre sí via localhost)
  # ============================================================
  config-server:
    build:
      context: ./infrastructure/config-server
    container_name: fp-config-server
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ../Ecommerce_files_configproperties:/fp_files_configproperties
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:8888/actuator/health > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-server:
    build:
      context: ./infrastructure/discovery-server
    container_name: fp-discovery-server
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
    container_name: fp-auth-service
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  user-service:
    build:
      context: ./services/user-service
    container_name: fp-user-service
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  product-service:
    build:
      context: ./services/product-service
    container_name: fp-product-service
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  order-service:
    build:
      context: ./services/order-service
    container_name: fp-order-service
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started

  gateway:
    build:
      context: ./infrastructure/gateway
    container_name: fp-gateway
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./apps/frontend/frontend-product-order
    container_name: fp-frontend
    network_mode: host
    depends_on:
      - gateway

volumes:
  kafka-data:
    driver: local
  mysql-data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge
